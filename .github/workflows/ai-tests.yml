name: AI Tests

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  MODEL: gemma3:4b
  DEEPEVAL_TELEMETRY_OPT_OUT: "1"
  PROMPTFOO_DISABLE_TELEMETRY: "1"

jobs:
  offline:
    name: Offline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest tests/offline_tests

  llm-evals:
    name: DeepEval + Promptfoo (local Ollama models)
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: pip install -r requirements.txt

      - name: Install Ollama and download the model
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > /tmp/ollama.log 2>&1 &
          sleep 5
          ollama pull "$MODEL"

      - name: DeepEval
        run: deepeval test run tests/deepeval_tests
      - name: Promptfoo - prompt comparison report (v1 is expected to fail some checks)
        if: always()
        run: npx -y promptfoo@latest eval -c promptfoo/promptfooconfig.yaml -o promptfoo-results.html || true
      - name: Promptfoo - improved prompt (v2) must pass every check
        if: always()
        run: npx -y promptfoo@latest eval -c promptfoo/promptfooconfig.yaml --filter-prompts support_v2
      - name: Promptfoo - RAG end-to-end
        if: always()
        run: PROMPTFOO_PYTHON=$(which python) npx -y promptfoo@latest eval -c promptfoo/rag_eval.yaml -o promptfoo-rag-results.html
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: promptfoo-reports
          path: "*.html"
